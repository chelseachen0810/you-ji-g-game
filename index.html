<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#101827" />
  <title>你几G网？</title>
  <style>
    :root{--bg:#101827;--card:#172238;--text:#f7f8ff;--muted:#9ca9c5;--cyan:#51e5d5;--yellow:#ffd166;--pink:#ff6b9d;--danger:#ff6b6b}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 0%,#293b67 0,#101827 46%,#0a101c 100%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;overflow-x:hidden}
    button{font:inherit;color:inherit;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}.app{width:100%;max-width:520px;min-height:100svh;margin:auto;padding:18px 18px 28px;display:flex;flex-direction:column}.top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px;letter-spacing:.06em}.logo{font-weight:900;color:var(--cyan);font-size:15px}.screen{display:none;flex:1;flex-direction:column}.screen.active{display:flex}.hero{margin:auto 0;text-align:center}.eyebrow{color:var(--yellow);font-weight:800;letter-spacing:.14em;font-size:13px}.hero h1{font-size:clamp(46px,14vw,72px);line-height:1;margin:18px 0 12px;letter-spacing:-.08em;text-shadow:5px 5px 0 rgba(255,107,157,.22)}.hero h1 span{color:var(--cyan)}.hero p{color:var(--muted);line-height:1.7;margin:0 auto 30px;max-width:300px}.primary{width:100%;padding:17px 20px;border-radius:18px;background:linear-gradient(135deg,var(--cyan),#2eb9e8);color:#09202d;font-weight:900;box-shadow:0 10px 26px rgba(81,229,213,.2);transition:transform .15s}.primary:active{transform:scale(.97)}.small-note{font-size:12px;color:#71809f;margin-top:15px}.rules{display:flex;gap:8px;justify-content:center;margin:0 0 24px}.pill{padding:8px 10px;border-radius:999px;background:rgba(255,255,255,.07);color:#cbd5ea;font-size:12px}.game-head{padding-top:12px}.progress-row{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:13px;margin-bottom:10px}.progress{height:7px;background:#27344d;border-radius:9px;overflow:hidden}.progress i{display:block;height:100%;width:10%;background:linear-gradient(90deg,var(--cyan),#8cf5d6);border-radius:9px;transition:width .25s}.timer{font-size:52px;text-align:center;font-weight:900;line-height:1;margin:28px 0 10px;color:var(--yellow);font-variant-numeric:tabular-nums}.timer.warning{color:var(--danger);animation:pulse .7s infinite alternate}@keyframes pulse{to{transform:scale(1.08)}}.question-card{background:rgba(23,34,56,.92);border:1px solid rgba(255,255,255,.08);border-radius:24px;padding:23px 18px 18px;box-shadow:0 20px 55px rgba(0,0,0,.18)}.tag{color:var(--pink);font-size:12px;font-weight:800}.question{font-size:23px;line-height:1.4;margin:10px 0 20px;font-weight:800}.answers{display:grid;gap:10px}.answer{background:#23314c;border:1px solid transparent;border-radius:15px;padding:15px;text-align:left;line-height:1.4;transition:.18s}.answer:active{transform:scale(.98)}.answer.correct{background:rgba(81,229,213,.18);border-color:var(--cyan)}.answer.wrong{background:rgba(255,107,107,.18);border-color:var(--danger)}.answer.locked{pointer-events:none}.answer b{display:inline-flex;width:25px;height:25px;align-items:center;justify-content:center;border-radius:8px;background:rgba(255,255,255,.1);margin-right:8px;color:var(--yellow)}.tip{text-align:center;color:var(--muted);font-size:12px;margin-top:18px}.result{margin:auto 0;text-align:center}.result .emoji{font-size:66px;margin-bottom:8px}.result h2{font-size:34px;margin:0 0 8px}.score{font-size:72px;line-height:1;color:var(--cyan);font-weight:900;margin:22px 0 4px}.score small{font-size:18px;color:var(--muted)}.result p{color:var(--muted);line-height:1.6}.stats{display:flex;justify-content:center;gap:12px;margin:24px 0}.stat{background:rgba(255,255,255,.07);padding:13px 19px;border-radius:15px;min-width:98px}.stat strong{display:block;font-size:22px;color:var(--yellow)}.stat span{display:block;font-size:12px;color:var(--muted);margin-top:3px}.result-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.secondary{width:100%;padding:15px 12px;border-radius:16px;background:rgba(255,255,255,.1);font-weight:800}.ranking{margin-top:24px;text-align:left;background:rgba(255,255,255,.06);border-radius:18px;padding:14px 15px}.ranking-title{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:800;margin-bottom:8px}.ranking-title span{font-size:11px;color:var(--muted);font-weight:400}.rank-row{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:13px}.rank-row:last-child{border-bottom:0}.rank-row em{font-style:normal;color:var(--yellow);font-weight:900}.rank-row small{color:var(--muted)}.footer{margin-top:auto;text-align:center;color:#5f6e8c;font-size:11px;padding-top:18px}.shake{animation:shake .28s}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  </style>
</head>
<body>
  <main class="app">
    <header class="top"><div class="logo">▰ 你几G网？</div><div id="status">V0.1 · H5</div></header>
    <section id="home" class="screen active">
      <div class="hero"><div class="eyebrow">抖音热梗网速测试</div><h1>你几<span>G</span>网？</h1><p>10 道当下热梗，5 秒极限反应。<br>答对只是入场，用时才是王道。</p><div class="rules"><span class="pill">10 道题</span><span class="pill">每题 5 秒</span><span class="pill">拼总用时</span></div><button class="primary" id="startBtn">开始冲浪 →</button><div class="small-note">答对优先 · 同样答对时用时更短排名更高</div></div>
    </section>
    <section id="game" class="screen">
      <div class="game-head"><div class="progress-row"><span id="questionNo">第 1 / 10 题</span><span id="liveScore">0 分</span></div><div class="progress"><i id="progressBar"></i></div></div>
      <div id="timer" class="timer">5.0</div>
      <div id="questionCard" class="question-card"><div id="tag" class="tag">#经典热梗</div><div id="question" class="question"></div><div id="answers" class="answers"></div></div>
      <div class="tip">选完自动进入下一题 · 别眨眼</div>
    </section>
    <section id="result" class="screen">
      <div class="result"><div id="resultEmoji" class="emoji">🏄</div><h2 id="resultTitle">冲浪达人</h2><p id="resultDesc"></p><div class="score" id="finalScore">0<small> 分</small></div><div class="stats"><div class="stat"><strong id="correctCount">0</strong><span>答对题数</span></div><div class="stat"><strong id="totalTime">0.0s</strong><span>总用时</span></div></div><button class="primary" id="shareBtn">分享好友挑战 ↗</button><div class="result-actions"><button class="secondary" id="rankingBtn">查看排行榜</button><button class="secondary" id="retryBtn">再来一局 ↻</button></div><div id="ranking" class="ranking" hidden><div class="ranking-title">本机排行榜 <span>答对优先 · 用时更短</span></div><div id="rankingList"></div></div></div>
    </section>
    <div class="footer">© 2026 · 保持在线，保持好奇</div>
  </main>
  <script>
    const questions=[
      {q:'“倒反天罡”通常是在吐槽什么？',a:['事情完全反过来、离谱到家','天气突然变冷','反复修改计划','古装剧很精彩'],c:0,t:'#2026热梗'},
      {q:'朋友说“汗流浃背了吧，老弟”，更接近什么意思？',a:['真的很热','尴尬到不知所措','运动后很健康','马上要下雨'],c:1,t:'#评论区名场面'},
      {q:'“活爹”在评论区里通常是？',a:['对小孩的正式称呼','对离谱行为的吐槽或调侃','祝福对方长寿','古代官职'],c:1,t:'#抽象表达'},
      {q:'“硬控我三分钟”中的“硬控”是指？',a:['强行让我关注、移不开眼','控制游戏角色','硬件坏了','控制音量'],c:0,t:'#短视频语境'},
      {q:'“偷感很重”通常形容一个人？',a:['偷偷学习很努力','做事偷偷摸摸、很有隐秘感','特别会偷东西','感情表达很直接'],c:1,t:'#生活热梗'},
      {q:'“已老实，求放过”最适合用在什么场景？',a:['认怂求停止调侃','正式道歉信','申请加薪','祝贺朋友获奖'],c:0,t:'#评论区热句'},
      {q:'“我嘞个豆”一般相当于哪种反应？',a:['我来吃豆子','我的天、太震惊了','我想睡觉','我支持你'],c:1,t:'#口头禅热梗'},
      {q:'把上厕所说成“释放内存”，属于哪种表达？',a:['科技产品说明','用科技感包装日常行为的抽象说法','医学术语','网络安全提醒'],c:1,t:'#抽象文学'},
      {q:'“不嘻嘻”一般表示？',a:['心情很好','不开心了、笑不出来','正在讲笑话','喜欢嘻哈音乐'],c:1,t:'#情绪梗'},
      {q:'“大馋丫头”通常是在形容？',a:['特别能吃、爱吃的人','很会讲故事的人','喜欢养宠物的人','跑得很快的人'],c:0,t:'#日常热梗'}
    ];
    let index=0,score=0,correct=0,totalTime=0,startTime=0,timerId=null,locked=false; const rankKey='you-ji-g-ranking-v01';
    const $=id=>document.getElementById(id); function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$(id).classList.add('active')}
    function render(){const d=questions[index];locked=false;$('questionNo').textContent=`第 ${index+1} / ${questions.length} 题`;$('liveScore').textContent=`${score} 分`;$('progressBar').style.width=`${(index+1)/questions.length*100}%`;$('tag').textContent=d.t;$('question').textContent=d.q;$('answers').innerHTML=d.a.map((x,i)=>`<button class="answer" data-i="${i}"><b>${String.fromCharCode(65+i)}</b>${x}</button>`).join('');document.querySelectorAll('.answer').forEach(b=>b.addEventListener('click',()=>answer(+b.dataset.i)));startTime=performance.now();clearInterval(timerId);timerId=setInterval(tick,50);tick()}
    function tick(){const left=Math.max(0,5-(performance.now()-startTime)/1000);$('timer').textContent=left.toFixed(1);$('timer').classList.toggle('warning',left<=2);if(left<=0){clearInterval(timerId);answer(-1)}}
    function answer(choice){if(locked)return;locked=true;clearInterval(timerId);const d=questions[index],elapsed=Math.min(5,(performance.now()-startTime)/1000),ok=choice===d.c;totalTime+=elapsed;if(ok){correct++;score+=100+Math.max(0,Math.round((5-elapsed)*20))}$('liveScore').textContent=`${score} 分`;document.querySelectorAll('.answer').forEach((b,i)=>{b.classList.add('locked');if(i===d.c)b.classList.add('correct');if(i===choice&&!ok)b.classList.add('wrong')});if(!ok)$('questionCard').classList.add('shake');setTimeout(()=>{$('questionCard').classList.remove('shake');index++;index<questions.length?render():finish()},520)}
    function finish(){clearInterval(timerId);const pct=Math.round(correct/questions.length*100);let title='继续冲浪',emoji='🛟',desc='网速还可以，再多刷刷梗就更稳了！';if(pct>=90){title='互联网冲浪王者';emoji='👑';desc='答对率拉满，手速也在线，评论区见！'}else if(pct>=70){title='资深冲浪选手';emoji='🏄';desc='梗海里来去自如，再快一点就无敌了。'}else if(pct>=50){title='冲浪实习生';emoji='🌊';desc='已经摸到浪花了，继续保持在线！'}$('resultEmoji').textContent=emoji;$('resultTitle').textContent=title;$('resultDesc').textContent=desc;$('finalScore').innerHTML=`${score}<small> 分</small>`;$('correctCount').textContent=`${correct}/${questions.length}`;$('totalTime').textContent=`${totalTime.toFixed(1)}s`;saveRank();show('result')}
    function getRanks(){try{return JSON.parse(localStorage.getItem(rankKey)||'[]')}catch(e){return []}}
    function saveRank(){const ranks=getRanks();ranks.push({score,correct,time:+totalTime.toFixed(1)});ranks.sort((a,b)=>b.correct-a.correct||b.score-a.score||a.time-b.time);localStorage.setItem(rankKey,JSON.stringify(ranks.slice(0,10)))}
    function renderRanks(){const ranks=getRanks();$('rankingList').innerHTML=ranks.length?ranks.slice(0,5).map((r,i)=>`<div class="rank-row"><em>${['🥇','🥈','🥉'][i]||i+1}</em><span>${r.correct}/${questions.length} 题 · ${r.score} 分</span><small>${r.time.toFixed(1)}s</small></div>`).join(''):'<div class="rank-row"><span>还没有成绩</span></div>';$('ranking').hidden=false}
    async function share(){const text=`我在《你几G网？》答对 ${correct}/${questions.length} 题，用时 ${totalTime.toFixed(1)} 秒，拿到 ${score} 分！敢来挑战我的网速吗？`;try{if(navigator.share)await navigator.share({title:'你几G网？',text,url:location.href});else throw new Error('fallback')}catch(e){try{await navigator.clipboard.writeText(text+' '+location.href);$('shareBtn').textContent='挑战文案已复制 ✓';setTimeout(()=>$('shareBtn').textContent='分享好友挑战 ↗',1600)}catch(err){alert(text)}}}
    function start(){index=0;score=0;correct=0;totalTime=0;$('ranking').hidden=true;show('game');render()}$('startBtn').addEventListener('click',start);$('retryBtn').addEventListener('click',start);$('shareBtn').addEventListener('click',share);$('rankingBtn').addEventListener('click',renderRanks);
  </script>
</body>
</html>
